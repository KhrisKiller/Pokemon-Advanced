name: tests

on:
  push:
  pull_request:

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          tools/install_godot.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Import project
        run: godot --headless --path . --import
      - name: Run tests
        run: godot --headless --path . res://tests/test_runner.tscn
